search-path = [".", "apps"]
site-packages-path = [".venv/Lib/site-packages"]
python-interpreter = ".venv/Scripts/python.exe"
disable-type-errors-in-ide = true
permissive-ignores = true
check-unannotated-defs = false
infer-return-types = "checked"
ignore-errors-in-generated-code = true
infer-with-first-use = true
strict-callable-subtyping = false
strict-partial-subtyping = false
spec-compliant-overloads = false
legacy-overload-expansion = false
treat-all-caps-as-final = false

enabled-ignores = [
    "type",
    "pyrefly",
    "pyright",
    "mypy",
    "ty",
    "pyre",
    "zuban",
]
type-ignore-unknown-tag-behavior = "suppress"

[errors]
missing-attribute = "ignore"
bad-argument-type = "ignore"
unsupported-operation = "ignore"
bad-override = "ignore"
bad-assignment = "ignore"
bad-context-manager = "ignore"
bad-function-definition = "ignore"
bad-override-mutable-attribute = "ignore"
bad-override-param-name = "ignore"
bad-return = "ignore"
missing-import = "ignore"
untyped-import = "ignore"
unknown-name = "ignore"
unbound-name = "ignore"
bad-specialization = "ignore"
bad-index = "ignore"
bad-instantiation = "ignore"
bad-keyword-argument = "ignore"
bad-match = "ignore"
incompatible-comparison = "ignore"
incompatible-overload-argument = "ignore"
incompatible-overload-residual = "ignore"
inconsistent-inheritance = "ignore"
inconsistent-overload = "ignore"
inconsistent-overload-default = "ignore"
invalid-annotation = "ignore"
invalid-argument = "ignore"
invalid-cast = "ignore"
invalid-decorator = "ignore"
invalid-inheritance = "ignore"
invalid-literal = "ignore"
invalid-overload = "ignore"
invalid-syntax = "ignore"
missing-argument = "ignore"
unexpected-keyword = "ignore"
bad-argument-count = "ignore"
not-callable = "ignore"
not-iterable = "ignore"
invalid-variance = "ignore"
