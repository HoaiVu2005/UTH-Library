version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: uth_library_db
    environment:
      POSTGRES_DB: uth_library
      POSTGRES_USER: uth_user
      POSTGRES_PASSWORD: uth_password
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uth_user -d uth_library"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: uth_library_backend
    environment:
      DEBUG: "False"
      SECRET_KEY: "prod-secret-key-change-in-env-file-for-production"
      JWT_SECRET: "prod-jwt-secret-change-in-env-file-for-production"
      DATABASE_URL: "postgres://uth_user:uth_password@db:5432/uth_library"
      ALLOWED_HOSTS: "localhost,127.0.0.1,backend,frontend,web"
      CORS_ALLOWED_ORIGINS: "http://localhost,http://127.0.0.1,http://localhost:80"
      TZ: "Asia/Ho_Chi_Minh"
    volumes:
      - media:/app/media
      - backups:/backups
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120"
    ports:
      - "8000:8000"
    restart: unless-stopped

  cron:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: uth_library_cron
    environment:
      DEBUG: "False"
      DATABASE_URL: "postgres://uth_user:uth_password@db:5432/uth_library"
      TZ: "Asia/Ho_Chi_Minh"
    volumes:
      - media:/app/media
      - backups:/backups
      - ./deploy:/deploy:ro
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
    command: supercronic /deploy/crontab
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: uth_library_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  media:
  backups:

